apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-api
  labels:
    app: rollout-api
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rollout-api
  template:
    metadata:
      labels:
        app: rollout-api
    spec:
      containers:
        - name: api
          image: rollout-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
